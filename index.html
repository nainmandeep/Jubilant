<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dhairya ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff4d6d; --secondary: #ff758f; --bg: #fff0f3; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
        .card { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(255, 77, 109, 0.15); text-align: center; max-width: 400px; width: 90%; z-index: 10; }
        .emoji { font-size: 3.5rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-family: 'Dancing Script', cursive; color: #2d3436; font-size: 2.2rem; margin-bottom: 1.5rem; }
        .btn-container { display: flex; justify-content: center; gap: 15px; height: 60px; align-items: center; position: relative; }
        .btn { padding: 14px 32px; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #yes-btn { background: var(--primary); color: white; z-index: 5; }
        #no-btn { background: #f1f2f6; color: #57606f; position: absolute; white-space: nowrap; }
        .hidden { display: none !important; }
        .success h2 { font-family: 'Dancing Script', cursive; color: var(--primary); font-size: 2.5rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div id="ask">
            <div class="emoji">🐱💖</div>
            <h1>Dhairya,<br>will you be my Valentine?</h1>
            <div class="btn-container">
                <button id="yes-btn" class="btn" onclick="celebrate()">Yes! ✨</button>
                <button id="no-btn" class="btn">No 🙈</button>
            </div>
        </div>
        <div id="success" class="hidden success">
            <div class="emoji">👩‍❤️‍👨✨</div>
            <h2>Yay! It's a Date!</h2>
            <p style="margin-top: 10px; color: #636e72;">See you on Feb 14th ❤️</p>
        </div>
    </div>
    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        let scale = 1;

        const moveNo = () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
            scale += 0.15;
            yesBtn.style.transform = `scale(${scale})`;
        };

        noBtn.addEventListener('mouseover', moveNo);
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveNo(); });

        function celebrate() {
            document.getElementById('ask').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ff758f'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ff758f'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
